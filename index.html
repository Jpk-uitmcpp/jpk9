<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Addresses</title>
</head>
<body>
  <h2>Stored Home Addresses</h2>
  <ul id="storedAddresses"></ul>
  <button id="clearButton">Clear All Addresses</button>

  <script>
    const listElement = document.getElementById('storedAddresses');
    const clearButton = document.getElementById('clearButton');

    function loadAddresses() {
      listElement.innerHTML = '';
      const addressList = JSON.parse(localStorage.getItem('userAddresses')) || [];

      if (addressList.length === 0) {
        listElement.innerHTML = '<li>No addresses found.</li>';
      } else {
        addressList.forEach(address => {
          const li = document.createElement('li');
          li.textContent = address;
          listElement.appendChild(li);
        });
      }
    }

    clearButton.addEventListener('click', () => {
      localStorage.removeItem('userAddresses');
      loadAddresses();
    });

    // Load addresses on page load
    loadAddresses();
  </script>
</body>
</html>
